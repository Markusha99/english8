<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>English 8 Revision Trainer</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Onest:wght@400;500;600;700&family=Sofia+Sans+Condensed:wght@600;800&display=swap">
<style>
/* Layout: a lesson contents sheet (vocabulary | grammar) leads to one exercise per screen, like a page on the board. */
:root{
  --bg:#eaeff5; --surface:#ffffff; --ink:#14233b; --muted:#55647c; --line:#cbd5e1;
  --accent:#1d5bd8; --on-accent:#ffffff; --accent-soft:#e2ebfd;
  --mark:#ffe169; --on-mark:#2a2200;
  --ok:#136f3d; --ok-bg:#dbf1e3; --bad:#b92d25; --bad-bg:#fbe1de;
  --display:'Sofia Sans Condensed','Arial Narrow','Roboto Condensed',sans-serif;
  --body:'Onest','Segoe UI',system-ui,sans-serif;
  --hand:'Caveat','Segoe Print','Comic Sans MS',cursive;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141f1b; --surface:#1d2c26; --ink:#eef3ec; --muted:#a6b7ac; --line:#3b5046;
    --accent:#9cc8ff; --on-accent:#0c1f38; --accent-soft:#243d48;
    --mark:#f3d56b; --on-mark:#2a2200;
    --ok:#86e0a4; --ok-bg:#1c452f; --bad:#ffa698; --bad-bg:#552725;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#141f1b; --surface:#1d2c26; --ink:#eef3ec; --muted:#a6b7ac; --line:#3b5046;
  --accent:#9cc8ff; --on-accent:#0c1f38; --accent-soft:#243d48;
  --mark:#f3d56b; --on-mark:#2a2200;
  --ok:#86e0a4; --ok-bg:#1c452f; --bad:#ffa698; --bad-bg:#552725;
  color-scheme:dark;
}
html{font-size:18px}
*,*::before,*::after{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 1rem/1.5 var(--body);-webkit-text-size-adjust:100%}
.wrap{max-width:76rem;margin-inline:auto;padding-inline:clamp(16px,3vw,40px);padding-block:1.25rem 2.5rem;display:flex;flex-direction:column;gap:1.25rem}
h1,h2,h3,h4,p,ol{margin:0}
ol{padding:0;list-style:none}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* top */
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:.75rem 1.5rem}
.eyebrow{font:600 .8rem/1.2 var(--body);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
h1{font:800 2.3rem/1 var(--display);text-transform:uppercase;letter-spacing:.01em;text-wrap:balance}
.tools{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center}
.btn{min-height:2.75rem;padding:.45em 1em;border:2px solid var(--line);border-radius:.55rem;background:var(--surface);font-weight:600;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.quiet{background:transparent}
.btn.sq{min-width:2.75rem;padding-inline:.5em}
.btn:disabled{opacity:.45;cursor:default}
.tabs{display:flex;flex-wrap:wrap;gap:.5rem;width:100%}
.tab{flex:1 1 13rem;min-width:0;text-align:left;padding:.6rem .9rem;border:2px solid var(--line);border-radius:.55rem;background:var(--surface);cursor:pointer;display:flex;flex-direction:column;gap:.1rem}
.tab small{font:600 .75rem/1.2 var(--body);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.tab b{font:800 1.35rem/1.1 var(--display);text-transform:uppercase}
.tab[aria-selected="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.tab[aria-selected="true"] small{color:var(--surface);opacity:.75}

/* board */
.board{background:var(--surface);border:2px solid var(--ink);border-radius:.9rem;padding:clamp(1rem,2.5vw,2rem);display:flex;flex-direction:column;gap:1.25rem;min-width:0}
.lesson-head{display:flex;flex-direction:column;gap:.3rem}
.lesson-head h2{font:800 2.6rem/1 var(--display);text-transform:uppercase;text-wrap:balance}
.sub{color:var(--muted);max-width:65ch}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(21rem,100%),1fr));gap:1.5rem 2.5rem}
.cols h3{font:800 1.25rem/1.1 var(--display);text-transform:uppercase;letter-spacing:.05em;padding-bottom:.4rem;border-bottom:2px solid var(--ink);margin-bottom:.4rem}
.toc{display:flex;flex-direction:column}
.toc button{width:100%;display:grid;grid-template-columns:2.2rem minmax(0,1fr) auto;align-items:baseline;gap:.25rem .6rem;text-align:left;padding:.65rem .25rem;background:none;border:0;border-bottom:1px solid var(--line);cursor:pointer;min-height:3rem}
.toc button:hover .tt{text-decoration:underline}
.toc .n{font:800 1.3rem/1 var(--display);color:var(--accent);font-variant-numeric:tabular-nums}
.toc .tt{font-weight:600}
.toc .ty{display:block;font-size:.8rem;color:var(--muted);font-weight:400}
.toc .sc{font:700 1.45rem/1 var(--hand);color:var(--muted);white-space:nowrap}
.toc .sc.full{color:var(--ok)}

/* exercise frame */
.crumbs{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:.5rem}
.crumbs .pos{font:600 .9rem/1.2 var(--body);color:var(--muted)}
.meta{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center}
.tag{font:700 .75rem/1 var(--body);letter-spacing:.09em;text-transform:uppercase;padding:.4em .7em;border-radius:99px;background:var(--accent-soft);color:var(--ink)}
.tag.grammar{background:transparent;box-shadow:inset 0 0 0 2px var(--line)}
.ref{font-size:.85rem;color:var(--muted)}
.exhead{display:flex;flex-direction:column;gap:.45rem}
.exhead h2{font:800 2.2rem/1.02 var(--display);text-transform:uppercase;text-wrap:balance}
.task{font-size:1.15rem;font-weight:500;max-width:65ch}
.how{font-size:.9rem;color:var(--muted)}
.exbody{min-width:0}
.exfoot{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center;padding-top:1rem;border-top:1px solid var(--line)}
.score{display:flex;flex-wrap:wrap;align-items:baseline;gap:.2rem .75rem;margin-left:auto}
.score b{font:700 2.3rem/1 var(--hand);color:var(--accent);white-space:nowrap}
.score.full b{color:var(--ok)}
.score span{font-size:.9rem;color:var(--muted)}
.lockbox{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center;padding:.9rem;border:2px dashed var(--line);border-radius:.55rem}
.lockbox label{font-weight:600}
.lockbox input{min-height:2.75rem;padding:.3em .7em;border:2px solid var(--line);border-radius:.55rem;background:var(--surface);width:11rem;max-width:100%;-webkit-text-security:disc}
.lockbox .err{color:var(--bad);font-size:.9rem;flex-basis:100%}
.pager{display:flex;justify-content:space-between;gap:.6rem}

/* shared interactive pieces */
.chip,.opt,.w{min-height:2.75rem;padding:.4em .8em;border:2px solid var(--line);border-radius:.55rem;background:var(--surface);font-weight:600;cursor:pointer;display:inline-block;text-align:center}
.chip.sel,.opt.sel,.w.sel,.slot.sel{background:var(--mark);border-color:var(--on-mark);color:var(--on-mark)}
.chip.ok,.opt.ok,.slot.ok,.gap.ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ink)}
.chip.bad,.opt.bad,.slot.bad,.gap.bad{background:var(--bad-bg);border-color:var(--bad);color:var(--ink)}
.chip.ok::after,.opt.ok::after,.slot.ok::after{content:" ✓";color:var(--ok)}
.chip.bad::after,.opt.bad::after,.slot.bad::after{content:" ✗";color:var(--bad)}
.items{display:flex;flex-direction:column;gap:1.1rem;counter-reset:it}
.item{counter-increment:it;display:grid;grid-template-columns:1.9rem minmax(0,1fr);gap:.2rem .4rem}
.item::before{content:counter(it) ".";font:800 1.3rem/1.5 var(--display);color:var(--muted);font-variant-numeric:tabular-nums}
.item>*{grid-column:2;min-width:0}
.q{font-size:1.15rem;line-height:1.9}
.opts{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;margin-top:.4rem}
.blank{display:inline-block;min-width:4.5rem;border-bottom:3px solid var(--ink);text-align:center;font-weight:700;color:var(--accent);padding-inline:.3rem;line-height:1.3}
.blank:empty::before{content:"\00a0"}

/* quiz */
.quiz{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(25rem,100%),1fr));gap:1.3rem 2.5rem}
.quiz.clocks .item{grid-template-columns:1.9rem 6.5rem minmax(0,1fr);align-items:center;column-gap:.7rem}
.quiz.clocks .item>.clock{grid-column:2}
.quiz.clocks .item>.main{grid-column:3}
.quiz.clocks .opts{flex-direction:column;align-items:stretch}
.clock svg{display:block;width:100%;height:auto}
.clock .face{fill:var(--surface);stroke:var(--ink);stroke-width:3}
.clock .tick{stroke:var(--ink);stroke-width:1.5;fill:none}
.clock .tick.big{stroke-width:3}
.clock text{fill:var(--ink);font:800 11px var(--display);text-anchor:middle;dominant-baseline:central}
.clock .hh{stroke:var(--ink);stroke-width:5;stroke-linecap:round;fill:none}
.clock .mh{stroke:var(--accent);stroke-width:3.2;stroke-linecap:round;fill:none}
.clock .pin{fill:var(--ink)}

/* pool, bins, slots */
.pool{display:flex;flex-wrap:wrap;gap:.5rem;padding:.7rem;border:2px dashed var(--line);border-radius:.55rem;min-height:4.3rem;position:sticky;top:env(safe-area-inset-top,0px);background:var(--surface);z-index:2;margin-bottom:1rem;max-height:34vh;overflow-y:auto}
.bins{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(10rem,100%),1fr));gap:.75rem}
.bin{border:2px solid var(--ink);border-radius:.55rem;min-height:9rem;cursor:pointer;display:flex;flex-direction:column;min-width:0}
.bin h4{font:800 1.3rem/1.1 var(--display);text-transform:uppercase;letter-spacing:.03em;padding:.5rem .7rem;border-bottom:2px solid var(--ink);text-align:center}
.bin .list{display:flex;flex-wrap:wrap;gap:.4rem;padding:.6rem;align-content:flex-start;flex:1}
.rows{display:flex;flex-direction:column;gap:.5rem;font-size:1.15rem;line-height:2.5}
.rows.match{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(24rem,100%),1fr));gap:.6rem 2.5rem;line-height:1.35}
.rows.match .row{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:.75rem;padding-block:.3rem;border-bottom:1px solid var(--line)}
.sp{font-weight:700;color:var(--muted)}
.slot{min-width:8.5rem;min-height:2.6rem;padding:.25em .7em;border:2px dashed var(--muted);border-radius:.55rem;background:transparent;font-weight:700;cursor:pointer;vertical-align:middle;line-height:1.3}
.slot.filled{border-style:solid;border-color:var(--accent);background:var(--accent-soft)}

/* typed */
.gap{min-height:2.6rem;padding:.2em .6em;border:2px solid var(--muted);border-radius:.55rem;background:var(--surface);font-weight:700;max-width:100%;vertical-align:middle;margin-inline:.15em}
.hint{color:var(--muted);font-style:italic}
.gm{font-weight:700;margin-right:.2em}
.gm.ok{color:var(--ok)} .gm.bad{color:var(--bad)}

/* order */
.build{display:flex;align-items:center;gap:.4rem;min-width:0}
.line{flex:1;min-width:0;display:flex;flex-wrap:wrap;gap:.4rem;min-height:3.5rem;padding:.35rem;border-bottom:3px solid var(--ink);align-items:center}
.line:not(.plain) .chip:first-child::first-letter{text-transform:uppercase}
.end{font:800 1.6rem/1 var(--display);min-width:1.8rem}
.tray{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.6rem;min-height:2.75rem}
.lbl{font-size:.9rem;color:var(--muted);font-weight:600}
.item.ok .build::after,.item.ok .sent::after{content:"✓";color:var(--ok);font-weight:700;margin-left:.3rem}
.item.bad .build::after,.item.bad .sent::after{content:"✗";color:var(--bad);font-weight:700;margin-left:.3rem}
.item.ok .line{border-color:var(--ok)} .item.bad .line{border-color:var(--bad)}

/* fix */
.sent{font-size:1.15rem;display:flex;flex-wrap:wrap;align-items:center;gap:.25rem .1rem}
.w{padding-inline:.35em;border-color:transparent;font-weight:500;font-size:inherit}
.w.fixed .old{text-decoration:line-through;opacity:.6}
.w .new{font-weight:700}
.w.fixed .new::before{content:" → "}
.replab{font-size:.9rem;color:var(--muted);font-weight:600}

.foot{font-size:.8rem;color:var(--muted);max-width:75ch}
@media (max-width:520px){
  h1{font-size:1.9rem}.lesson-head h2{font-size:2rem}.exhead h2{font-size:1.75rem}
  .quiz.clocks .item{grid-template-columns:1.9rem 5rem minmax(0,1fr)}
  .score{margin-left:0;flex-basis:100%}
  .slot{min-width:6.5rem}
}
</style>

</div>

/* ---------- helpers ---------- */
const $ = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };
const btn = (cls, txt) => { const b = $('button', cls, txt); b.type = 'button'; return b; };
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const norm = s => String(s).toLowerCase().replace(/[’‘`ʼ]/g, "'").replace(/\s+/g, ' ').trim().replace(/[.?!]+$/, '').trim();
const hash = s => { let h = 5381; for (const ch of String(s).trim().toUpperCase()) h = ((h * 33) ^ ch.charCodeAt(0)) >>> 0; return h.toString(36); };
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
const mark = (el, good) => { el.classList.remove('ok', 'bad'); if (good != null) el.classList.add(good ? 'ok' : 'bad'); };

function clockSVG(h, m) {
  let t = '';
  for (let i = 0; i < 12; i++) t += `<line class="tick${i % 3 ? '' : ' big'}" x1="50" y1="7" x2="50" y2="${i % 3 ? 11 : 13}" transform="rotate(${i * 30} 50 50)"/>`;
  const num = [[12, 50, 21], [3, 80, 50], [6, 50, 80], [9, 20, 50]].map(([n, x, y]) => `<text x="${x}" y="${y}">${n}</text>`).join('');
  return `<svg viewBox="0 0 100 100" role="img" aria-label="Годинник"><circle class="face" cx="50" cy="50" r="46"/>${t}${num}` +
    `<line class="hh" x1="50" y1="50" x2="50" y2="29" transform="rotate(${(h % 12) * 30 + m * 0.5} 50 50)"/>` +
    `<line class="mh" x1="50" y1="50" x2="50" y2="15" transform="rotate(${m * 6} 50 50)"/><circle class="pin" cx="50" cy="50" r="3"/></svg>`;
}

/* ---------- exercise builders: each returns {el, check() -> [right,total], reveal()} ---------- */
const BUILD = {
  quiz(ex) {
    const el = $('ol', 'items quiz' + (ex.items[0].clock ? ' clocks' : ''));
    const parts = ex.items.map(it => {
      const li = $('li', 'item');
      if (it.clock) { const f = $('div', 'clock'); f.innerHTML = clockSVG(it.clock[0], it.clock[1]); li.append(f); }
      const main = $('div', 'main'), q = $('p', 'q'), opts = $('div', 'opts');
      let blank = null, chosen = -1;
      it.q.split('___').forEach((s, i) => { if (i) { blank = $('span', 'blank'); q.append(blank); } q.append(s); });
      const pick = k => { chosen = k; btns.forEach(b => { mark(b); b.classList.toggle('sel', +b.dataset.k === k); }); if (blank) blank.textContent = it.o[k]; };
      const btns = shuffle(it.o.map((t, k) => [t, k])).map(([t, k]) => { const b = btn('opt', t); b.dataset.k = k; b.onclick = () => pick(k); opts.append(b); return b; });
      main.append(q, opts); li.append(main); el.append(li);
      return {
        check() { btns.forEach(b => mark(b)); const b = btns.find(b => +b.dataset.k === chosen); if (b) { b.classList.remove('sel'); mark(b, chosen === 0); } return chosen === 0; },
        reveal() { pick(0); }
      };
    });
    return { el, check: () => [parts.filter(p => p.check()).length, parts.length], reveal: () => parts.forEach(p => p.reveal()) };
  },

  bins(ex) {
    const el = $('div'), pool = $('div', 'pool'), grid = $('div', 'bins');
    let sel = null;
    const setSel = c => { if (sel) sel.classList.remove('sel'); sel = c; if (c) c.classList.add('sel'); };
    const move = (chip, to) => { mark(chip); to.append(chip); setSel(null); };
    const lists = ex.cats.map(name => {
      const bin = $('div', 'bin'), list = $('div', 'list');
      bin.tabIndex = 0; bin.setAttribute('role', 'button'); bin.setAttribute('aria-label', 'Колонка ' + name);
      bin.append($('h4', '', name), list);
      bin.onclick = () => { if (sel) move(sel, list); };
      bin.onkeydown = e => { if (e.target === bin && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); bin.click(); } };
      grid.append(bin); return list;
    });
    pool.onclick = () => { if (sel && sel.parentNode !== pool) move(sel, pool); };
    const chips = shuffle(ex.items).map(([t, c]) => {
      const b = btn('chip', t);
      b.onclick = e => {
        e.stopPropagation();
        const p = b.parentNode;
        if (sel && sel !== b && p !== pool && sel.parentNode !== p) { move(sel, p); return; }
        mark(b); setSel(sel === b ? null : b);
      };
      pool.append(b); return [b, c];
    });
    el.append(pool, grid);
    return {
      el,
      check() { let r = 0; chips.forEach(([b, c]) => { const i = lists.indexOf(b.parentNode); mark(b, i < 0 ? null : i === c); if (i === c) r++; }); setSel(null); return [r, chips.length]; },
      reveal() { setSel(null); chips.forEach(([b, c]) => { mark(b); lists[c].append(b); }); }
    };
  },

  slots(ex) {
    const el = $('div'), bank = $('div', 'pool'), rows = $('div', 'rows' + (ex.match ? ' match' : ''));
    let sel = null, selSlot = null;
    const setSel = c => { if (sel) sel.classList.remove('sel'); sel = c; if (c) c.classList.add('sel'); };
    const setSlot = s => { if (selSlot) selSlot.classList.remove('sel'); selSlot = s; if (s) s.classList.add('sel'); };
    const clear = s => { if (s._chip) { s._chip.hidden = false; s._chip = null; } s.textContent = ''; s.classList.remove('filled'); mark(s); };
    const place = (s, chip) => { clear(s); s._chip = chip; chip.hidden = true; s.textContent = chip.textContent; s.classList.add('filled'); setSel(null); setSlot(null); };
    const slots = [];
    ex.rows.forEach(r => {
      const row = $('div', 'row');
      let s = null;
      if (r.a != null) {
        s = btn('slot'); s._a = r.a; s._chip = null; s.setAttribute('aria-label', 'пропуск');
        s.onclick = () => { if (sel) place(s, sel); else if (s._chip) clear(s); else setSlot(selSlot === s ? null : s); };
        slots.push(s);
      }
      if (ex.match) row.append($('span', 'term', r.pre), s);
      else { if (r.sp) row.append($('b', 'sp', r.sp + ': ')); row.append(r.pre || ''); if (s) row.append(s, r.post || ''); }
      rows.append(row);
    });
    const chips = shuffle(ex.rows.filter(r => r.a != null).map(r => r.a).concat(ex.extra || [])).map(t => {
      const c = btn('chip', t);
      c.onclick = () => { if (selSlot) place(selSlot, c); else setSel(sel === c ? null : c); };
      bank.append(c); return c;
    });
    el.append(bank, rows);
    return {
      el,
      check() { let r = 0; setSel(null); setSlot(null); slots.forEach(s => { if (!s._chip) { mark(s); return; } const good = s._chip.textContent === s._a; mark(s, good); if (good) r++; }); return [r, slots.length]; },
      reveal() { slots.forEach(clear); slots.forEach(s => place(s, chips.find(c => !c.hidden && c.textContent === s._a))); }
    };
  },

  type(ex) {
    const el = $('ol', 'items');
    const inputs = [];
    ex.items.forEach(str => {
      const li = $('li', 'item'), p = $('p', 'q');
      str.split(/(\{[^}]+\}|\([^)]+\))/).forEach(seg => {
        if (!seg) return;
        if (seg[0] === '{') {
          const alts = seg.slice(1, -1).split('|');
          const i = $('input', 'gap'); i.type = 'text'; i.id = ex.id + '-g' + inputs.length;
          i.autocomplete = 'off'; i.autocapitalize = 'off'; i.spellcheck = false;
          i.size = Math.max(...alts.map(a => a.length)) + 1; i.setAttribute('aria-label', 'відповідь');
          const m = $('span', 'gm'); i._alts = alts.map(norm); i._show = alts[0]; i._m = m;
          i.oninput = () => { mark(i); m.textContent = ''; };
          inputs.push(i); p.append(i, m);
        } else if (seg[0] === '(') p.append($('span', 'hint', seg));
        else p.append(seg);
      });
      li.append(p); el.append(li);
    });
    return {
      el,
      check() { let r = 0; inputs.forEach(i => { if (!i.value.trim()) { mark(i); i._m.textContent = ''; return; } const good = i._alts.includes(norm(i.value)); mark(i, good); i._m.className = 'gm ' + (good ? 'ok' : 'bad'); i._m.textContent = good ? '✓' : '✗'; if (good) r++; }); return [r, inputs.length]; },
      reveal() { inputs.forEach(i => { i.value = i._show; mark(i); i._m.textContent = ''; }); }
    };
  },

  order(ex) {
    const el = $('ol', 'items');
    const parts = ex.items.map(it => {
      const li = $('li', 'item'), build = $('div', 'build'), line = $('div', 'line' + (it.plain ? ' plain' : '')), tray = $('div', 'tray');
      if (it.label) li.append($('p', 'lbl', it.label));
      build.append(line); if (it.end) build.append($('span', 'end', it.end));
      const target = it.w.join(' ');
      let order = shuffle(it.w); for (let n = 0; n < 8 && order.join(' ') === target; n++) order = shuffle(it.w);
      const chips = order.map(t => { const c = btn('chip', t); c.onclick = () => { mark(li); (c.parentNode === tray ? line : tray).append(c); }; tray.append(c); return c; });
      li.append(build, tray); el.append(li);
      return {
        check() { const got = [...line.children].map(c => c.textContent).join(' '); if (!line.children.length) { mark(li); return false; } const good = norm(got) === norm(target) || (it.alt || []).some(a => norm(a) === norm(got)); mark(li, good); return good; },
        reveal() { mark(li); it.w.forEach(t => line.append(chips.find(c => c.textContent === t && !c._used && (c._used = true)))); chips.forEach(c => { c._used = false; }); }
      };
    });
    return { el, check: () => [parts.filter(p => p.check()).length, parts.length], reveal: () => parts.forEach(p => p.reveal()) };
  },

  fix(ex) {
    const el = $('ol', 'items');
    const parts = ex.items.map(it => {
      const li = $('li', 'item'), sent = $('p', 'sent'), row = $('div', 'opts');
      row.hidden = true;
      let idx = -1, opt = -1;
      const toks = it.s.split(' ');
      const wrong = toks.findIndex(t => t.replace(/[.?!,]+$/, '') === it.w);
      const ws = toks.map((t, i) => {
        const m = t.match(/^(.*?)([.?!,]*)$/);
        const b = btn('w'), neu = $('span', 'new'); b.append($('span', 'old', m[1]), neu, m[2]);
        b.onclick = () => { idx = idx === i ? -1 : i; opt = -1; draw(); };
        sent.append(b);
        return { b, neu };
      });
      const obtns = shuffle(it.o.map((t, k) => [t, k])).map(([t, k]) => { const b = btn('opt', t); b.dataset.k = k; b.onclick = () => { opt = k; draw(); }; return b; });
      row.append($('span', 'replab', 'Заміни на:'), ...obtns);
      function draw() {
        mark(li);
        ws.forEach((w, i) => { w.b.classList.toggle('sel', i === idx); w.b.classList.toggle('fixed', i === idx && opt >= 0); w.neu.textContent = i === idx && opt >= 0 ? it.o[opt] : ''; });
        obtns.forEach(b => b.classList.toggle('sel', +b.dataset.k === opt));
        row.hidden = idx < 0;
      }
      li.append(sent, row); el.append(li);
      return {
        check() { const good = idx === wrong && opt === 0; mark(li, idx < 0 ? null : good); return good; },
        reveal() { idx = wrong; opt = 0; draw(); }
      };
    });
    return { el, check: () => [parts.filter(p => p.check()).length, parts.length], reveal: () => parts.forEach(p => p.reveal()) };
  }
};

/* ---------- app state ---------- */
const view = document.getElementById('view'), tabs = document.getElementById('tabs'), relock = document.getElementById('relock');
const scores = {};                       // ex.id -> [right,total]
const nodes = new Map();                 // ex.id -> built exercise node, so answers survive navigation
const unlocked = new Set(store.get('e8-unlocked', []));
let cur = { l: 0, e: -1 };

function syncLock() { relock.hidden = unlocked.size === 0; store.set('e8-unlocked', [...unlocked]); }
relock.onclick = () => { unlocked.clear(); syncLock(); };

function scoreLabel(id) { const s = scores[id]; return s ? s[0] + ' / ' + s[1] : ''; }

function menu(L, li) {
  const board = $('section', 'board');
  const head = $('div', 'lesson-head');
  head.append($('p', 'eyebrow', 'Lesson ' + L.n + ' · ' + L.pages), $('h2', '', L.title), $('p', 'sub', L.sub));
  const cols = $('div', 'cols');
  [['vocab', 'Лексика'], ['grammar', 'Граматика']].forEach(([kind, name]) => {
    const sec = $('section'), ol = $('ol', 'toc');
    sec.append($('h3', '', name), ol);
    L.ex.forEach((ex, i) => {
      if (ex.kind !== kind) return;
      const item = $('li'), b = btn('');
      const tt = $('span', 'tt', ex.title); tt.append($('span', 'ty', TYPE_UA[ex.type] + ' · ' + ex.ref));
      const s = scores[ex.id];
      b.append($('span', 'n', String(i + 1)), tt, $('span', 'sc' + (s && s[0] === s[1] ? ' full' : ''), scoreLabel(ex.id)));
      b.onclick = () => go(li, i);
      item.append(b); ol.append(item);
    });
    cols.append(sec);
  });
  board.append(head, cols);
  return board;
}

function exercise(L, li, ei) {
  const ex = L.ex[ei];
  const frag = $('div'); frag.style.display = 'flex'; frag.style.flexDirection = 'column'; frag.style.gap = '1rem';
  const crumbs = $('div', 'crumbs'), back = btn('btn quiet', '← Зміст уроку');
  back.onclick = () => go(li, -1);
  crumbs.append(back, $('span', 'pos', 'Lesson ' + L.n + ' · вправа ' + (ei + 1) + ' із ' + L.ex.length));
  if (!nodes.has(ex.id)) nodes.set(ex.id, frame(L, ex));
  const pager = $('div', 'pager'), prev = btn('btn', '← Попередня'), next = btn('btn', 'Наступна →');
  prev.disabled = ei === 0; next.disabled = ei === L.ex.length - 1;
  prev.onclick = () => go(li, ei - 1); next.onclick = () => go(li, ei + 1);
  pager.append(prev, next);
  frag.append(crumbs, nodes.get(ex.id), pager);
  return frag;
}

function frame(L, ex) {
  const board = $('article', 'board');
  const head = $('header', 'exhead'), meta = $('div', 'meta');
  meta.append($('span', 'tag ' + ex.kind, ex.kind === 'vocab' ? 'Лексика' : 'Граматика'), $('span', 'ref', ex.ref));
  head.append(meta, $('h2', '', ex.title), $('p', 'task', ex.task), $('p', 'how', HOW[ex.type]));
  const body = $('div', 'exbody');
  const foot = $('footer', 'exfoot');
  const bCheck = btn('btn primary', 'Перевірити'), bReset = btn('btn', 'Спочатку'), bShow = btn('btn quiet', 'Відповіді');
  const score = $('div', 'score'); score.setAttribute('aria-live', 'polite');
  foot.append(bCheck, bReset, bShow, score);

  const lock = $('form', 'lockbox'); lock.hidden = true;
  const lab = $('label', '', 'Код учителя для Lesson ' + L.n + ':'), inp = $('input'), ok = $('button', 'btn primary', 'Відкрити'), err = $('p', 'err');
  inp.type = 'text'; inp.id = ex.id + '-code'; inp.autocomplete = 'off'; inp.spellcheck = false; lab.htmlFor = inp.id; ok.type = 'submit'; err.hidden = true;
  lock.append(lab, inp, ok, err);

  let api;
  const say = (big, small, full) => { score.className = 'score' + (full ? ' full' : ''); score.replaceChildren(); if (big) score.append($('b', '', big)); if (small) score.append($('span', '', small)); };
  const mount = () => { api = BUILD[ex.type](ex); body.replaceChildren(api.el); say('', ''); };
  const reveal = () => { api.reveal(); lock.hidden = true; say('', 'Показано правильні відповіді.'); };
  mount();

  bCheck.onclick = () => {
    const [r, t] = api.check(); scores[ex.id] = [r, t];
    say(r + ' / ' + t, r === t ? 'Усе правильно!' : 'Виправ позначене ✗ або дороби пропущене і перевір ще раз.', r === t);
  };
  bReset.onclick = () => { delete scores[ex.id]; mount(); };
  bShow.onclick = () => {
    if (unlocked.has(L.id)) { reveal(); return; }
    lock.hidden = !lock.hidden; err.hidden = true; if (!lock.hidden) inp.focus();
  };
  lock.onsubmit = e => {
    e.preventDefault();
    if (hash(inp.value) === L.hash) { unlocked.add(L.id); syncLock(); inp.value = ''; reveal(); }
    else { err.textContent = 'Код не підходить. Перевір розкладку клавіатури і спробуй ще раз.'; err.hidden = false; }
  };
  board.append(head, body, foot, lock);
  return board;
}

function render() {
  [...tabs.children].forEach((t, i) => t.setAttribute('aria-selected', String(i === cur.l)));
  const L = LESSONS[cur.l];
  view.replaceChildren(cur.e < 0 ? menu(L, cur.l) : exercise(L, cur.l, cur.e));
}
function go(l, e) {
  cur = { l, e }; render();
  try { history.replaceState(null, '', '#' + LESSONS[l].id + (e >= 0 ? '-' + (e + 1) : '')); } catch (err) {}
  store.set('e8-pos', cur);
  try { window.scrollTo(0, 0); } catch (err) {}
}

LESSONS.forEach((L, i) => {
  const t = btn('tab'); t.setAttribute('role', 'tab');
  t.append($('small', '', 'Lesson ' + L.n + ' · ' + L.pages), $('b', '', L.title));
  t.onclick = () => go(i, -1);
  tabs.append(t);
});

/* text size + fullscreen */
const SIZES = [15, 18, 21, 24, 28];
let fs = Math.min(SIZES.length - 1, Math.max(0, store.get('e8-fs', 1)));
const applyFs = () => { document.documentElement.style.fontSize = SIZES[fs] + 'px'; store.set('e8-fs', fs); document.getElementById('fsDown').disabled = fs === 0; document.getElementById('fsUp').disabled = fs === SIZES.length - 1; };
document.getElementById('fsDown').onclick = () => { fs = Math.max(0, fs - 1); applyFs(); };
document.getElementById('fsUp').onclick = () => { fs = Math.min(SIZES.length - 1, fs + 1); applyFs(); };
applyFs();
const full = document.getElementById('full');
if (!document.fullscreenEnabled) full.hidden = true;
full.onclick = () => { try { const p = document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen(); if (p && p.catch) p.catch(() => {}); } catch (e) {} };

/* start: deep link (#l3 or #l3-2), else last position */
(function start() {
  const m = /^#(l\d)(?:-(\d+))?$/.exec(location.hash || '');
  let pos = store.get('e8-pos', { l: 0, e: -1 });
  if (m) { const l = LESSONS.findIndex(L => L.id === m[1]); if (l >= 0) pos = { l, e: m[2] ? +m[2] - 1 : -1 }; }
  if (!pos || !LESSONS[pos.l]) pos = { l: 0, e: -1 };
  if (!(pos.e >= 0 && pos.e < LESSONS[pos.l].ex.length)) pos.e = -1;
  cur = pos; syncLock(); render();
})();
})();
</script>
